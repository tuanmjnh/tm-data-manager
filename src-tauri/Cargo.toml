[package]
name = "udmt-desktop"
version = "0.1.0"
description = "UDMT — Universal Data Management Tool desktop shell"
authors = ["tm-data-manager"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "udmt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The shell refuses to start from a Low-integrity process: WebView2 runs at Medium
# and cannot be launched, which used to surface as a silent black window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
